<svg xmlns="http://www.w3.org/2000/svg" viewBox="150 210 745 460" width="745" height="460" role="img" aria-labelledby="title desc">
  <title id="title">russ.rest terminal and cloud icon</title>
  <desc id="desc">A dark terminal window with russ.rest prompt and a white-filled cloud in front.</desc>
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f2338" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Terminal window -->
  <rect x="158" y="218" width="584" height="442" rx="42" fill="#172b40"/>
  <rect x="175" y="235" width="547" height="407" rx="25" fill="#2d3f56"/>
  <rect x="175" y="291" width="547" height="17" fill="#172b40" opacity="0.95"/>

  <!-- Window controls -->
  <circle cx="207" cy="263" r="13" fill="#ef5d5d"/>
  <circle cx="249" cy="263" r="13" fill="#f7bd58"/>
  <circle cx="291" cy="263" r="13" fill="#55bd68"/>

  <!-- Terminal text -->
  <g fill="#dce9f4" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-weight="700">
    <text x="204" y="367" font-size="50">~/russ.rest$_</text>
    <text x="204" y="445" font-size="58">$</text>
  </g>

  <!-- Cloud: white filled, properly closed shape -->
  <g filter="url(#softShadow)">
    <path d="M533.5 652.5
      C493.5 650.0 454.0 617.0 454.0 572.0
      C454.0 533.0 482.5 502.0 525.0 492.0
      C526.0 455.0 551.0 426.0 587.0 426.0
      C593.0 426.0 599.0 426.7 605.0 428.0
      C624.0 394.5 657.5 374.0 698.0 374.0
      C755.0 374.0 800.5 417.8 806.0 475.0
      C850.0 480.5 876.0 518.0 876.0 568.0
      C876.0 614.5 839.5 652.5 793.5 652.5
      Z"
      fill="#ffffff" stroke="#4fa0d3" stroke-width="17" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- subtle lower cloud rim -->
    <path d="M470 570 C480 606 512 620 552 620 L788 620 C831 620 858 599 872 562
      C868 613 831 644 790 644 L536 644 C499 644 468 617 470 570 Z"
      fill="#cfe4ef" opacity="0.85"/>
    <path d="M533.5 652.5
      C493.5 650.0 454.0 617.0 454.0 572.0
      C454.0 533.0 482.5 502.0 525.0 492.0
      C526.0 455.0 551.0 426.0 587.0 426.0
      C593.0 426.0 599.0 426.7 605.0 428.0
      C624.0 394.5 657.5 374.0 698.0 374.0
      C755.0 374.0 800.5 417.8 806.0 475.0
      C850.0 480.5 876.0 518.0 876.0 568.0
      C876.0 614.5 839.5 652.5 793.5 652.5
      Z"
      fill="none" stroke="#4fa0d3" stroke-width="17" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</svg>
